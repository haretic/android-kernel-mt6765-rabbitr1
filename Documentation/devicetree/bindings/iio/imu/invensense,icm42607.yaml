%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/invensense,icm42607.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: InvenSense ICM-42607 and ICM-42670 Inertial Measurement Units

maintainers:
  - Kenny <0@kenny.cat>

description: |
  6-axis MotionTracking devices combining a 3-axis gyroscope and a 3-axis
  accelerometer, with a 2.25 kB FIFO, two interrupt pins, the APEX motion
  engine and an I3C, I2C or SPI host interface. Their register map differs
  from the ICM-426xx parts described in invensense,icm42600.yaml.

properties:
  compatible:
    enum:
      - invensense,icm42607p
      - invensense,icm42670p

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    maxItems: 2
    items:
      enum:
        - INT1
        - INT2

  mount-matrix:
    description: an optional 3x3 mounting rotation matrix.

  vdd-supply:
    description: Regulator that provides power to the sensor

  vddio-supply:
    description: Regulator that provides power to the bus

  spi-cpha: true
  spi-cpol: true

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        imu@0 {
            compatible = "invensense,icm42607p";
            reg = <0>;
            spi-max-frequency = <10000000>;
        };
    };
