%YAML 1.2
---
$id: http://devicetree.org/schemas/input/ocs,och1970.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Orient Chip OCH1970 Hall sensor scroll wheel

maintainers:
  - Kenny <0@kenny.cat>

description:
  3D Hall-effect sensor on I2C placed next to a magnetised wheel. The wheel
  angle follows the field in the sensor's X/Z plane and is reported as
  KEY_UP and KEY_DOWN steps.

properties:
  compatible:
    const: ocs,och1970

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        wheel@d {
            compatible = "ocs,och1970";
            reg = <0x0d>;
            reset-gpios = <&pio 173 GPIO_ACTIVE_LOW>;
        };
    };
