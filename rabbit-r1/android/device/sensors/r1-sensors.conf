# Mainline sensors HAL settings for the r1 (see
# hardware/mainline/common/interfaces/sensors/mainline/README.md).
# Only the ICM-42607 IMU on SPI4 is real; leave out the mock fallback.
backends = iio
wait_for_sensors = 2

# The upstream inv_icm42607 driver registers the accelerometer and the
# gyroscope as separate IIO devices, icm42607p-accel and icm42607p-gyro.
# Board orientation of the IMU is not yet measured. Tune it live with
#   setprop vendor.sensors.iio.icm42607p_accel.mount_matrix "a, b, c; d, e, f; g, h, i"
# (and the same for icm42607p_gyro) and record the result here.
[iio.icm42607p_accel]
power = 0.6

[iio.icm42607p_gyro]
power = 0.6
