#
# libcamera global configuration, installed to
# /vendor/etc/libcamera/configuration.yaml.

---
version: 1
configuration:
  software_isp:
    # All eight Cortex-A53s are online after boot. One thread debayers
    # 1632x1224 at ~11 fps (8 with the CCM); four reach the sensor's 30 fps.
    threads: 4
