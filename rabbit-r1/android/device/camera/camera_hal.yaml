#
# libcamera Android HAL configuration, installed to
# /vendor/etc/libcamera/camera_hal.yaml. The key is the libcamera camera ID,
# the device tree path of the sensor node (hi846 at 0x20 on i2c2).

cameras:
  "/base/soc/i2c@11009000/camera@20":
    location: back
    # Frames need a 270 degree clockwise rotation to be upright. The
    # libcamera Rotation property from the device tree (rotation = <90>,
    # counter-clockwise) takes precedence; keep the two in agreement.
    rotation: 270
