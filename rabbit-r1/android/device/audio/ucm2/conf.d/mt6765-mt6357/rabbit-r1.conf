Syntax 4

# rabbit r1: MT6765 AFE + MT6357 codec, AW87390 speaker amplifier on the
# MT6357 line output. PCM 0 = DL1 playback, PCM 2 = UL1 (VUL) capture.

SectionUseCase."HiFi" {
	File "/Rabbit/r1/HiFi.conf"
	Comment "Default"
}

BootSequence [
	# AFE interconnect: DL1 -> ADDA DL, ADDA UL -> UL1
	cset "name='ADDA_DL_CH1 DL1_CH1' on"
	cset "name='ADDA_DL_CH2 DL1_CH2' on"
	cset "name='UL1_CH1 ADDA_UL_CH1' on"
	cset "name='UL1_CH2 ADDA_UL_CH2' on"

	# No headphone jack on the r1
	cset "name='Headphone Left Source' Open"
	cset "name='Headphone Right Source' Open"
	cset "name='Headphone Switch' off"

	cset "name='Line Out Source' Open"
	cset "name='Speaker Switch' off"
	# Index 10 is 0 dB (-10 dB + 1 dB per step); the amplifier adds gain.
	cset "name='Lineout Volume' 10"

	cset "name='Main Mic Switch' off"
	cset "name='Mic Type Mux' ACC"
	cset "name='PGA L Mux' AIN0"
	cset "name='PGA R Mux' AIN0"
	cset "name='Mic Volume' 3"
]
